<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#0a1d33;overflow:hidden;font-family:'IBM Plex Mono',monospace;color:#d8ecff}
a{color:#7fc4ff}a:hover{color:#bfe3ff}
input::placeholder{color:#5f86ad}
button,a{font-family:'IBM Plex Mono',monospace}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ffb547;outline-offset:2px}
#host{position:absolute;inset:0;touch-action:none;isolation:isolate;z-index:0}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.14em;color:#7fc4ff;pointer-events:none}
.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none;z-index:10}
.card{display:flex;flex-direction:column;gap:4px;padding:12px 16px;background:rgba(8,22,40,.86);border:1px solid rgba(127,196,255,.28);border-radius:4px;pointer-events:auto}
.kicker{font-size:10px;letter-spacing:.16em;color:#7fc4ff}
.title{font-family:'Archivo',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;color:#fff}
#stats{font-size:11px;color:#9fc2e3}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:auto}
.btn{font-size:12px;font-weight:600;letter-spacing:.08em;padding:11px 14px;border:1px solid rgba(127,196,255,.28);border-radius:4px;cursor:pointer;background:rgba(8,22,40,.86);color:#d8ecff;text-decoration:none}
.btn.link{font-weight:700;border-color:rgba(127,196,255,.55)}
.btn.primary{border-color:#ffb547;background:#ffb547;color:#06182c}
.modes{display:flex;gap:2px;padding:3px;background:rgba(8,22,40,.86);border:1px solid rgba(127,196,255,.28);border-radius:4px}
.modes button{font-size:12px;font-weight:600;letter-spacing:.08em;padding:8px 14px;border:0;border-radius:3px;cursor:pointer;background:transparent;color:#bfe3ff}
.modes button[aria-pressed=true]{background:#7fc4ff;color:#06182c}
#panel{position:absolute;top:132px;left:14px;bottom:14px;width:266px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;background:rgba(8,22,40,.9);border:1px solid rgba(127,196,255,.28);border-radius:4px;overflow:hidden;z-index:10}
#panel[hidden]{display:none}
#q{width:100%;font-size:12px;padding:9px 10px;background:#0a1d33;border:1px solid rgba(127,196,255,.35);border-radius:3px;color:#fff}
#list{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:4px 12px 12px;display:flex;flex-direction:column;gap:14px}
.tbl{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.tbl-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.tbl-h b{font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;color:#fff}
.tbl-h span{font-size:10px;color:#7fa6cc;letter-spacing:.04em}
.side{font:700 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#89acd1;padding-top:5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.seat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;min-width:0;font-size:10px;padding:6px 7px;border-radius:3px;cursor:pointer}
.legend{display:flex;gap:14px;padding:10px 12px;border-top:1px solid rgba(127,196,255,.18);font-size:10px;color:#9fc2e3}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#mini-wrap{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;padding:10px;background:rgba(8,22,40,.9);border:1px solid rgba(127,196,255,.28);border-radius:4px;z-index:10}
#mini{width:180px;height:245px;display:block;cursor:crosshair}
#sel{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:12px 14px 12px 16px;background:rgba(8,22,40,.92);border:1px solid #7fc4ff;border-radius:4px;max-width:calc(100vw - 40px);z-index:15}
#sel[hidden]{display:none}
#sel-meta{font-size:10px;letter-spacing:.14em;color:#7fc4ff}
#sel-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:18px}
#hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:7px 12px;border-radius:7px;background:rgba(6,21,39,.85);border:1px solid #345e84;color:#c5e2f8;font:600 11px 'IBM Plex Mono',monospace;white-space:nowrap;pointer-events:none;z-index:9;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#walk-pad{position:absolute;left:16px;bottom:16px;display:none;grid-template-columns:repeat(3,44px);gap:5px;z-index:11}
#walk-pad button{padding:12px 0;font-size:16px;border:1px solid rgba(127,196,255,.35);border-radius:4px;background:rgba(8,22,40,.9);color:#d8ecff;touch-action:none}
#walk-pad button:first-child{grid-column:2}
@media (max-width:760px){
  .card{max-width:100%}#stats{overflow-wrap:anywhere}.title{font-size:16px}.top{top:10px;left:10px;right:10px}.btn{padding:8px 10px;font-size:11px}.modes button{padding:7px 9px;font-size:11px}
  #panel{top:auto;bottom:10px;left:10px;height:38vh;width:calc(100vw - 20px)}
  #mini-wrap{display:none}#hint{display:none}#sel{bottom:calc(38vh + 20px)}
  #walk-pad{bottom:calc(38vh + 20px)}
}
.office-global-header{position:relative;z-index:100;background:#0c1d32;color:#e8f3ff;border-bottom:1px solid #315370;box-shadow:0 4px 18px #0002;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.office-global-inner{max-width:1600px;margin:0 auto;min-height:58px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.office-global-brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:15px;font-weight:850;letter-spacing:.025em;color:#fff}.office-brand-logo{display:block;width:151px;height:40px;object-fit:contain;background:transparent;border:0;filter:none}.office-global-brand span{white-space:nowrap}
.office-global-tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

@media(max-width:640px){.office-global-inner{gap:7px;min-height:54px;padding:7px 10px}.office-global-brand{font-size:12px;gap:7px}.office-brand-logo{width:103px;height:28px}.office-global-tabs a{font-size:11px;padding:9px 10px}}


.office-global-header{position:absolute;top:0;left:0;right:0;z-index:30}.top{top:76px}#panel{top:190px}@media(max-width:760px){.top{top:112px}#panel{top:auto}}

<body>
<header class="office-global-header" aria-label="Office navigation header"><div class="office-global-inner"><div class="office-global-brand"><img class="office-brand-logo" src="/assets/aerosimple-logo.svg" alt="Aerosimple logo" width="151" height="40"><span>Office Seating Planner</span></div><nav class="office-global-tabs" aria-label="Office tabs"><a href="/layout.html">Beach Office</a><a href="/main-office-floor1.html">Main Office · 1st Floor</a><a href="/main-office-floor2.html">Main Office · 2nd Floor</a><a href="/main-office-floor3.html" class="active" aria-current="page">Main Office · 3rd Floor</a></nav></div></header>
<div id="host" tabindex="0" aria-label="Interactive 3D model of Main Office third floor"></div>
<div id="loading">LOADING FLOOR MODEL…</div>

<div class="top">
  <div class="card">
    <div class="kicker">MAIN OFFICE · 3RD FLOOR</div>
    <div class="title">Main Office · 3rd Floor Seating</div>
    <div id="stats">Loading seats…</div>
    
  </div>
  <div class="tools">
    <div class="modes" id="modes" aria-label="View selection">
      <button data-mode="plan">TOP VIEW</button><button data-mode="orbit">3D VIEW</button><button data-mode="walk">WALK</button>
    </div>
    <button class="btn" id="labels-btn">DESK LABELS ON</button>
    <button class="btn primary" id="save-btn">SAVE IMAGE</button>
    <button class="btn" id="panel-btn">HIDE LIST</button>
  </div>
</div>

<div id="panel">
  <div style="padding:12px;border-bottom:1px solid rgba(127,196,255,.18)"><input id="q" type="search" placeholder="Find a person…" aria-label="Find a person or seat"></div>
  <div id="list"></div>
  <div class="legend"><span><i style="background:#7fc4ff"></i>Assigned</span><span><i style="border:1px dashed #ffb547"></i>Open seat</span></div>
</div>

<div id="mini-wrap">
  <div style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:#7fc4ff"><span>MINI MAP</span><span>N ↑</span></div>
  <canvas id="mini" width="180" height="245" aria-label="Mini map — click to move the view"></canvas>
  <div id="mini-hint" style="font-size:10px;color:#7fa6cc">Click to recenter the view</div>
</div>

<div id="sel" hidden>
  <div style="display:flex;flex-direction:column;gap:3px"><div id="sel-meta"></div><div id="sel-name"></div></div>
  <button id="sel-edit" style="padding:9px 13px;color:#06182c;background:#ffb547;border:0;border-radius:3px;font-weight:700;cursor:pointer;white-space:nowrap">EDIT NAME</button>
  <button id="sel-close" aria-label="Clear selection" style="font-size:14px;width:32px;height:32px;border:1px solid rgba(127,196,255,.35);border-radius:3px;background:transparent;color:#d8ecff;cursor:pointer">×</button>
</div>
<div id="hint"></div>
<div id="walk-pad" aria-label="Walk controls"><button data-key="ArrowUp" aria-label="Move forward">↑</button><button data-key="ArrowLeft" aria-label="Turn left">↶</button><button data-key="ArrowDown" aria-label="Move backward">↓</button><button data-key="ArrowRight" aria-label="Turn right">↷</button></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------------------------------------------------------------------------
// Layout traced from the hand-drawn 3rd-floor sketch. Sketch pixel coords
// (1200×1600 photo) are converted to metres: 1 px ≈ 2 cm. North = top of sketch.
// ---------------------------------------------------------------------------
const S = 0.02, X = px => +((px - 520) * S).toFixed(2), Z = py => +((py - 805) * S).toFixed(2);
const B = { x1: X(60), x2: X(980), z1: Z(250), z2: Z(1360) };
const CX = (B.x1 + B.x2) / 2, CZ = (B.z1 + B.z2) / 2;
const PLAN_KEY = 'main-f3';

// Tables: cx/cz centre, len along the seat rows, dep across. vertical = rows run north–south.
const tbl = (id, x1, y1, x2, y2, n, opts = {}) => {
  const vertical = !!opts.vertical, w = (x2 - x1) * S, d = (y2 - y1) * S;
  return { id, cx: X((x1 + x2) / 2), cz: Z((y1 + y2) / 2), len: vertical ? d : w, dep: vertical ? w : d, n, vertical, collab: !!opts.collab };
};
const TABLES = [
  tbl('T1', 120, 560, 415, 630, 4),
  tbl('T2', 120, 705, 415, 775, 4),
  tbl('T3', 120, 850, 415, 920, 4),
  tbl('T4', 120, 1010, 415, 1070, 4),
  tbl('T5', 560, 540, 725, 635, 2),
  tbl('T6', 575, 740, 710, 790, 2),
  tbl('T7', 575, 890, 710, 945, 2),
  tbl('T8', 580, 1020, 705, 1065, 2)
];
const room = (n, x1, y1, x2, y2, extra = {}) => ({ n, x1: X(x1), z1: Z(y1), x2: X(x2), z2: Z(y2), lx: X((x1 + x2) / 2), lz: Z((y1 + y2) / 2), ...extra });
const ROOMS = [
  room('MEETING ROOM', 310, 250, 980, 415),
  room('STAIRS', 60, 250, 310, 490),
  room('ENTRANCE', 315, 420, 435, 490, {open: true}),
  room('WASH ROOM', 60, 1170, 520, 1360),
  room('HR CABIN', 520, 1170, 980, 1360),
  room('WORK AREA', 75, 510, 440, 1130, {open: true, lx: X(85), lz: Z(810)})
];
const EXITS = [{ n: 'EXIT 1', z: Z(630) }, { n: 'EXIT 2', z: Z(1035) }, { n: 'EXIT 3', z: Z(1255) }];
// Approximate outline; openings align with the three exits in the reference.
const W = [
  [60,250,980,250], [60,250,60,1360], [60,1360,980,1360],
  [980,250,980,590], [980,670,980,995], [980,1075,980,1215], [980,1295,980,1360],
  // Extend the stair enclosure; its entrance faces east beside the meeting room.
  // The south wall is continuous, so there is no entrance facing the tables.
  [60,490,310,490],
  [310,250,310,420],
  [310,415,980,415,1],
  // Full-width bottom block, split equally into toilet and HR cabin.
  [520,1170,520,1360],
  [60,1170,250,1170], [320,1170,520,1170],
  [520,1170,715,1170,1], [785,1170,980,1170,1]
].map(([a,b,c,d,g]) => [X(a),Z(b),X(c),Z(d),g]);

// Seats: two rows per table; vertical table rows are left/right. 48 workstation seats total.
function buildSeats() {
  const out = [];
  TABLES.forEach(t => {
    const sides = t.vertical ? [['left', -1], ['right', 1]] : [['top', -1], ['bottom', 1]];
    sides.forEach(([side, away]) => {
      for (let i = 0; i < t.n; i++) {
        const along = -t.len / 2 + t.len * (i + 0.5) / t.n, off = away * (t.dep / 2 + 0.42);
        const x = t.vertical ? t.cx + off : t.cx + along, z = t.vertical ? t.cz + along : t.cz + off;
        out.push({ key: `${t.id}-${side}-${i}`, table: t.id, side, idx: i, away, x, z, name: '' });
      }
    });
  });
  return out;
}
const seats = buildSeats();
const seatName = s => `${s.table} · ${s.side[0].toUpperCase() + s.side.slice(1)} ${s.idx + 1}`;

// Floor-specific local storage keeps names separate from other floors.
const LS = 'main-office-floor3-names-v1';
let source = 'local', updating = false;
const readLocal = () => { try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch { return {}; } };
const writeLocal = names => { try { localStorage.setItem(LS, JSON.stringify(names)); return true; } catch { return false; } };
async function refreshSeats() {
  const names = readLocal();
  seats.forEach(s => { s.name = String(names[s.key] ?? '').trim(); });
  refreshVisuals();
}
async function editSeat(key) {
  const s = seats.find(s => s.key === key); if (!s) return;
  const typed = window.prompt(`Employee for ${seatName(s)}\nLeave blank to clear.`, s.name || '');
  if (typed === null) return;
  const name = typed.trim();
  if (name.length > 70) { alert('Use a name with at most 70 characters.'); return; }
  const names = readLocal(); names[key] = name;
  if (!writeLocal(names)) { alert('Could not save the name. Try again.'); return; }
  s.name = name; refreshVisuals();
}
window.addEventListener('storage', e => { if (e.key === LS) refreshSeats(); });

// --------------------------- scene ---------------------------
const $ = id => document.getElementById(id), host = $('host');
const state = { mode: 'plan', selKey: null, hoverKey: null, labels: true, q: '' };
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); }
catch (e) { $('loading').textContent = 'WEBGL IS UNAVAILABLE — ENABLE HARDWARE ACCELERATION AND RELOAD'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab';
host.appendChild(renderer.domElement);
const lr = new CSS2DRenderer();
lr.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden';
host.appendChild(lr.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a1d33');
scene.fog = new THREE.Fog('#0a1d33', 55, 130);
const cam = new THREE.PerspectiveCamera(50, 1, 0.05, 300); cam.rotation.order = 'YXZ'; cam.position.set(18, 24, 30);
const controls = new OrbitControls(cam, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: true, zoomSpeed: 0.8, panSpeed: 0.8, rotateSpeed: 0.65, maxPolarAngle: Math.PI * 0.47, minDistance: 6, maxDistance: 110 });
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

scene.add(new THREE.HemisphereLight('#e6f1ff', '#3a4656', 0.9));
const sun = new THREE.DirectionalLight('#fff3e2', 2.4);
sun.position.set(10, 26, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -19, right: 19, top: 19, bottom: -19, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; scene.add(sun);
const fill = new THREE.DirectionalLight('#9cc8ff', 0.5); fill.position.set(-12, 10, -8); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshBasicMaterial({ color: '#0a1d33' }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.25; scene.add(ground);
const grid = new THREE.GridHelper(140, 140, '#1f4a75', '#15375c'); grid.position.y = -0.24; scene.add(grid);

function tex(base, grout, nx, ny, jitter, planks) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  const w = 512 / nx, h = 512 / ny;
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    const off = planks && j % 2 ? w / 2 : 0;
    g.fillStyle = `rgba(${Math.random() < 0.5 ? '255,255,255' : '0,0,0'},${Math.random() * jitter})`;
    g.fillRect(i * w + off, j * h, w, h); if (planks) g.fillRect(i * w + off - 512, j * h, w, h);
  }
  for (let k = 0; k < 2500; k++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.04})`; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2); }
  g.strokeStyle = grout; g.lineWidth = planks ? 1.5 : 2.5;
  for (let j = 0; j <= ny; j++) { g.beginPath(); g.moveTo(0, j * h); g.lineTo(512, j * h); g.stroke(); }
  for (let j = 0; j < ny; j++) for (let i = 0; i <= nx; i++) { const off = planks && j % 2 ? w / 2 : 0; g.beginPath(); g.moveTo(i * w + off, j * h); g.lineTo(i * w + off, (j + 1) * h); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const M = o => new THREE.MeshStandardMaterial(o);
const Bx = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const add = (geo, mat, x, y, z, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m; };
const FW = B.x2 - B.x1, FD = B.z2 - B.z1;

// floor slab + zones
const floorTex = tex('#cfc8bc', '#b6aea2', 4, 4, 0.05); floorTex.repeat.set(FW / 2.4, FD / 2.4);
const side = M({ color: '#8b95a3' });
const slab = new THREE.Mesh(Bx(FW + 0.3, 0.24, FD + 0.3), [side, side, M({ map: floorTex, roughness: 0.8 }), side, side, side]);
slab.position.set(CX, -0.12, CZ); slab.receiveShadow = true; scene.add(slab);
const zone = (x1, z1, x2, z2, mat) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(x2 - x1, z2 - z1), mat); m.rotation.x = -Math.PI / 2; m.position.set((x1 + x2) / 2, 0.004, (z1 + z2) / 2); m.receiveShadow = true; scene.add(m); };
const R = n => ROOMS.find(r => r.n === n);
const rz = (n, mat) => { const r = R(n); zone(r.x1, r.z1, r.x2, r.z2, mat); };
const wTex = tex('#eef1f3', '#c8cfd6', 8, 8, 0.03); wTex.repeat.set(3, 2);
rz('WASH ROOM', M({ map: wTex, roughness: 0.35 }));
const cTex = tex('#5c6a7a', '#536071', 6, 6, 0.05); cTex.repeat.set(2, 3);
const carpet = M({ map: cTex, roughness: 0.95 });
['MEETING ROOM'].forEach(n => rz(n, carpet));
const woodTex = tex('#b48a62', '#8a6544', 3, 16, 0.12, true); woodTex.repeat.set(2, 1.4);
const woodFloor = M({ map: woodTex, roughness: 0.6 });
['HR CABIN'].forEach(n => rz(n, woodFloor));
EXITS.forEach(e => zone(B.x2 - 1.2, e.z - 0.8, B.x2, e.z + 0.8, M({ color: '#1f5c45', roughness: 1 })));

// walls
const wallMat = M({ color: '#efebe4', roughness: 0.9 });

    const w = g.measureText(txt).width + 14 * k, h = (size + 9) * k;

    if (bd) { g.strokeStyle = bd; g.lineWidth = k; g.strokeRect(x - w / 2, y - h / 2, w, h); }
    g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, x, y + 0.5 * k);
  };
  const proj = (x, y, z) => { const v = V(x, y, z).project(cam); return v.z < 1 ? [(v.x + 1) / 2 * Wd, (1 - v.y) / 2 * H] : null; };
  ROOMS.forEach(r => { const p = proj(r.lx, 0.05, r.lz); if (p) pill(r.n, p[0], p[1], '#06182c', '#7fc4ff', null, 11); });
  EXITS.forEach(e => { const p = proj(B.x2 - 0.9, 0.05, e.z); if (p) pill(e.n, p[0], p[1], '#06182c', '#7ef3bc', null, 11); });
  if (state.labels) TABLES.forEach(t => { const p = proj(t.cx, 1.4, t.cz); if (p) pill('TABLE ' + t.id.slice(1), p[0], p[1], '#fff', 'rgba(8,22,40,0.88)', '#7fc4ff', 12); });
  if (state.mode === 'plan') seats.forEach(s => { if (!s.name) return; const p = proj(s.x, 0.8, s.z); if (p) pill(s.name, p[0], p[1], '#254260', '#fff', '#bed4e5', 10); });
  const a = document.createElement('a'); a.download = `main-office-floor3-${state.mode}.png`; a.href = out.toDataURL('image/png'); a.click();
};

// mini map
const mini = $('mini'); let miniS = 1;
const MP = (x, z) => [(x - B.x1 + 0.4) * miniS, (z - B.z1 + 0.4) * miniS];
function drawMini() {
  const Wm = 180, Hm = 245, dpr = Math.min(devicePixelRatio || 1, 2);
  if (mini.width !== Wm * dpr) { mini.width = Wm * dpr; mini.height = Hm * dpr; }
  const g = mini.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  miniS = Math.min(Wm / (FW + 0.8), Hm / (FD + 0.8));
  g.fillStyle = '#0a1d33'; g.fillRect(0, 0, Wm, Hm);
  ROOMS.forEach(r => {
    const [a, b] = MP(r.x1, r.z1), [c, d] = MP(r.x2, r.z2);
    g.fillStyle = r.open ? 'rgba(255,181,71,0.1)' : 'rgba(127,196,255,0.1)'; g.fillRect(a, b, c - a, d - b);
    g.fillStyle = '#7fc4ff'; g.font = '600 6px "IBM Plex Mono", monospace'; g.textAlign = 'center'; g.fillText(r.n.split(' ')[0], (a + c) / 2, (b + d) / 2 + 2);
  });
  W.forEach(([x1, z1, x2, z2, gl]) => { const [a, b] = MP(x1, z1), [c, d] = MP(x2, z2); g.strokeStyle = gl ? 'rgba(127,196,255,0.6)' : '#bfe3ff'; g.lineWidth = gl ? 1 : 2; g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); });
  EXITS.forEach(e => { const [a, b] = MP(B.x2, e.z); g.fillStyle = '#7ef3bc'; g.fillRect(a - 2, b - 8, 4, 16); });
  TABLES.forEach(t => {
    const w = (t.vertical ? t.dep : t.len) * miniS, h = (t.vertical ? t.len : t.dep) * miniS;
    const [a, b] = MP(t.cx, t.cz);
    g.fillStyle = 'rgba(127,196,255,0.25)'; g.strokeStyle = '#7fc4ff'; g.lineWidth = 1; g.fillRect(a - w / 2, b - h / 2, w, h); g.strokeRect(a - w / 2, b - h / 2, w, h);
    g.fillStyle = '#fff'; g.font = '600 7px "IBM Plex Mono", monospace'; g.textAlign = 'center'; g.fillText(t.id, a, b + 2.5);
  });
  seats.forEach(s => {
    const [a, b] = MP(s.x, s.z), sel = s.key === state.selKey;
    g.beginPath(); g.arc(a, b, sel ? 3.6 : 2.2, 0, Math.PI * 2);
    if (sel) { g.fillStyle = '#fff'; g.fill(); } else if (s.name) { g.fillStyle = '#7fc4ff'; g.fill(); } else { g.strokeStyle = '#ffb547'; g.lineWidth = 1; g.stroke(); }
  });
  const dir = new THREE.Vector3(); cam.getWorldDirection(dir);
  const p = state.mode !== 'walk' && !walking ? controls.target : cam.position;
  const [a, b] = MP(p.x, p.z), ang = Math.atan2(dir.z, dir.x);
  if (Math.hypot(dir.x, dir.z) > 0.2) { g.fillStyle = 'rgba(255,181,71,0.28)'; g.beginPath(); g.moveTo(a, b); g.arc(a, b, 28, ang - 0.45, ang + 0.45); g.closePath(); g.fill(); }
  g.fillStyle = '#ffb547'; g.beginPath(); g.arc(a, b, 4, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#0a1d33'; g.lineWidth = 1.5; g.stroke();
}
mini.onclick = e => {
  const r = mini.getBoundingClientRect();
  const x = (e.clientX - r.left) / miniS + B.x1 - 0.4, z = (e.clientY - r.top) / miniS + B.z1 - 0.4;
  if (x < B.x1 || x > B.x2 || z < B.z1 || z > B.z2) return;
  if (state.mode === 'walk') { const p = V(x, 1.6, z); flyTo(p, p.clone().add(fwd()).add(V(0, pitch, 0)), () => { walking = true; }, 500); }
  else { const off = cam.position.clone().sub(controls.target), t = V(x, 0, z); flyTo(t.clone().add(off), t, () => { controls.target.copy(t); controls.enabled = true; controls.update(); }, 600); }
};

function resize() {
  const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); lr.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host); resize();

function loop(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  walls.forEach(w => { const target = state.mode === 'walk' ? w.userData.full : 1.1; w.scale.y += (target - w.scale.y) * Math.min(1, dt * 5); });
  if (anim) {
    const a = anim, k = Math.min(1, (now - a.start) / a.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    cam.position.lerpVectors(a.p0, a.p1, e); cam.lookAt(new THREE.Vector3().lerpVectors(a.t0, a.t1, e));
    if (k >= 1) { anim = null; a.onEnd && a.onEnd(); }
  } else if (walking) {
    const f = fwd(), r = V(Math.cos(yaw), 0, -Math.sin(yaw)), mv = new THREE.Vector3();
    if (keys.KeyW || keys.ArrowUp) mv.add(f); if (keys.KeyS || keys.ArrowDown) mv.sub(f);
    if (keys.KeyD) mv.add(r); if (keys.KeyA) mv.sub(r);
    if (keys.ArrowLeft) yaw += dt * 1.8; if (keys.ArrowRight) yaw -= dt * 1.8;
    if (mv.lengthSq()) cam.position.addScaledVector(mv.normalize(), dt * 3);
    cam.position.x = Math.max(B.x1 + 0.3, Math.min(B.x2 - 0.3, cam.position.x));
    cam.position.z = Math.max(B.z1 + 0.3, Math.min(B.z2 - 0.3, cam.position.z));
    cam.position.y = 1.6; cam.rotation.set(pitch, yaw, 0);
  } else if (controls.enabled) controls.update();
  Object.values(seatLabels).forEach(({ el, s }) => { el.style.opacity = state.mode === 'plan' || s.key === state.selKey || s.key === state.hoverKey ? '1' : '0'; });
  renderer.render(scene, cam); lr.render(scene, cam); drawMini();
}

$('loading').remove();
const startMode = new URL(location.href).searchParams.get('view');
setMode(['plan', 'orbit', 'walk'].includes(startMode) ? startMode : 'plan', true);
refreshVisuals();
refreshSeats();
setInterval(refreshSeats, 5000);
renderer.setAnimationLoop(loop);
</script>
