<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Main Office · 2nd Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#0a1d33;overflow:hidden;font-family:'IBM Plex Mono',monospace;color:#d8ecff}
a{color:#7fc4ff}a:hover{color:#bfe3ff}
input::placeholder{color:#5f86ad}
button,a{font-family:'IBM Plex Mono',monospace}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ffb547;outline-offset:2px}
#host{position:absolute;inset:0;touch-action:none;isolation:isolate;z-index:0}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.14em;color:#7fc4ff;pointer-events:none}
.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none;z-index:10}
.card{display:flex;flex-direction:column;gap:4px;padding:12px 16px;background:rgba(8,22,40,.86);border:1px solid rgba(127,196,255,.28);border-radius:4px;pointer-events:auto}
.kicker{font-size:10px;letter-spacing:.16em;color:#7fc4ff}
.title{font-family:'Archivo',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;color:#fff}
#stats{font-size:11px;color:#9fc2e3}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:auto}
.btn{font-size:12px;font-weight:600;letter-spacing:.08em;padding:11px 14px;border:1px solid rgba(127,196,255,.28);border-radius:4px;cursor:pointer;background:rgba(8,22,40,.86);color:#d8ecff;text-decoration:none}
.btn.link{font-weight:700;border-color:rgba(127,196,255,.55)}
.btn.primary{border-color:#ffb547;background:#ffb547;color:#06182c}
.modes{display:flex;gap:2px;padding:3px;background:rgba(8,22,40,.86);border:1px solid rgba(127,196,255,.28);border-radius:4px}
.modes button{font-size:12px;font-weight:600;letter-spacing:.08em;padding:8px 14px;border:0;border-radius:3px;cursor:pointer;background:transparent;color:#bfe3ff}
.modes button[aria-pressed=true]{background:#7fc4ff;color:#06182c}
#panel{position:absolute;top:132px;left:14px;bottom:14px;width:266px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;background:rgba(8,22,40,.9);border:1px solid rgba(127,196,255,.28);border-radius:4px;overflow:hidden;z-index:10}
#panel[hidden]{display:none}
#q{width:100%;font-size:12px;padding:9px 10px;background:#0a1d33;border:1px solid rgba(127,196,255,.35);border-radius:3px;color:#fff}
#list{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:4px 12px 12px;display:flex;flex-direction:column;gap:14px}
.tbl{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.tbl-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.tbl-h b{font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;color:#fff}
.tbl-h span{font-size:10px;color:#7fa6cc;letter-spacing:.04em}
.side{font:700 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#89acd1;padding-top:5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.seat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;min-width:0;font-size:10px;padding:6px 7px;border-radius:3px;cursor:pointer}
.legend{display:flex;gap:14px;padding:10px 12px;border-top:1px solid rgba(127,196,255,.18);font-size:10px;color:#9fc2e3}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#mini-wrap{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;padding:10px;background:rgba(8,22,40,.9);border:1px solid rgba(127,196,255,.28);border-radius:4px;z-index:10}
#mini{width:180px;height:245px;display:block;cursor:crosshair}
#sel{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:12px 14px 12px 16px;background:rgba(8,22,40,.92);border:1px solid #7fc4ff;border-radius:4px;max-width:calc(100vw - 40px);z-index:15}
#sel[hidden]{display:none}
#sel-meta{font-size:10px;letter-spacing:.14em;color:#7fc4ff}
#sel-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:18px}
#hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:7px 12px;border-radius:7px;background:rgba(6,21,39,.85);border:1px solid #345e84;color:#c5e2f8;font:600 11px 'IBM Plex Mono',monospace;white-space:nowrap;pointer-events:none;z-index:9;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#walk-pad{position:absolute;left:16px;bottom:16px;display:none;grid-template-columns:repeat(3,44px);gap:5px;z-index:11}
#walk-pad button{padding:12px 0;font-size:16px;border:1px solid rgba(127,196,255,.35);border-radius:4px;background:rgba(8,22,40,.9);color:#d8ecff;touch-action:none}
#walk-pad button:first-child{grid-column:2}
@media (max-width:760px){
  .card{max-width:100%}#stats{overflow-wrap:anywhere}.title{font-size:16px}.top{top:10px;left:10px;right:10px}.btn{padding:8px 10px;font-size:11px}.modes button{padding:7px 9px;font-size:11px}
  #panel{top:auto;bottom:10px;left:10px;height:38vh;width:calc(100vw - 20px)}
  #mini-wrap{display:none}#hint{display:none}#sel{bottom:calc(38vh + 20px)}
  #walk-pad{bottom:calc(38vh + 20px)}
}
.office-global-header{position:relative;z-index:100;background:#0c1d32;color:#e8f3ff;border-bottom:1px solid #315370;box-shadow:0 4px 18px #0002;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.office-global-inner{max-width:1600px;margin:0 auto;min-height:58px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.office-global-brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:15px;font-weight:850;letter-spacing:.025em;color:#fff}.office-brand-logo{display:block;width:151px;height:40px;object-fit:contain;background:transparent;border:0;filter:none}.office-global-brand span{white-space:nowrap}
.office-global-tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.office-global-tabs a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:10px 17px;border:1px solid #395979;border-radius:8px;background:#152b45;color:#cfdef0;font-size:13px;line-height:1.2;white-space:nowrap;font-weight:750;transition:background .15s}
.office-global-tabs a:hover{background:#254665;color:#fff}
.office-global-tabs a.active,.office-global-tabs a[aria-current="page"]{background:#7fc4ff;color:#06182c;border-color:#7fc4ff}
.office-global-tabs a:focus-visible{outline:2px solid #ffb547;outline-offset:2px}
@media(max-width:640px){.office-global-inner{gap:7px;min-height:54px;padding:7px 10px}.office-global-brand{font-size:12px;gap:7px}.office-brand-logo{width:103px;height:28px}.office-global-tabs a{font-size:11px;padding:9px 10px}}


.office-global-header{position:absolute;top:0;left:0;right:0;z-index:30}.top{top:76px}#panel{top:190px}@media(max-width:760px){.top{top:112px}#panel{top:auto}}

.seat[aria-pressed=true]{box-shadow:0 0 0 2px #fff;background:#7fc4ff;color:#06182c}
#assignment-current{background:#173d5f;padding:12px;border-radius:6px;color:#d7eaff;margin-bottom:14px}
.employee-row{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;padding:10px;margin:5px 0;background:#102c46;color:#fff;border:1px solid #335a7b;border-radius:5px;cursor:pointer}
.employee-row span{font-size:11px;color:#a1c7e6;overflow-wrap:anywhere}
.employee-row[aria-pressed=true]{border:2px solid #ffb547;background:#244968}
#assignment-dialog{width:min(560px,calc(100vw - 32px));max-height:85vh;box-sizing:border-box;background:#0a1d33;color:#fff;border:1px solid #7fc4ff;border-radius:12px;padding:20px}
#assignment-dialog::backdrop{background:#0009}
#assignment-dialog input{box-sizing:border-box;width:100%;padding:10px;background:#132e48;color:#fff;border:1px solid #52799b;border-radius:5px;margin:6px 0 12px}
#assignment-dialog label{font-size:12px;color:#bfe3ff}
#assignment-employees{height:220px;overflow:auto;border-block:1px solid #335a7b}
#assignment-note{font-size:12px;color:#bfe3ff;min-height:30px}
.assignment-actions{display:flex;gap:8px;flex-wrap:wrap}
#assignment-dialog button:disabled{opacity:.4;cursor:default}
.assignment-help{margin-top:8px;font-size:12px;line-height:1.4;color:#a9cee9}

</style>

<body>
<header class="office-global-header" aria-label="Office navigation header"><div class="office-global-inner"><div class="office-global-brand"><img class="office-brand-logo" src="/assets/aerosimple-logo.svg" alt="Aerosimple logo" width="151" height="40"><span>Office Seating Planner</span></div><nav class="office-global-tabs" aria-label="Office tabs"><a href="/layout.html">Beach Office</a><a href="/main-office-floor1.html">Main Office · 1st Floor</a><a href="/main-office-floor2.html" class="active" aria-current="page">Main Office · 2nd Floor</a><a href="/main-office-floor3.html">Main Office · 3rd Floor</a></nav></div></header>
<div id="host" tabindex="0" aria-label="Interactive 3D model of Main Office second floor"></div>
<div id="loading">LOADING FLOOR MODEL…</div>

<div class="top">
  <div class="card">
    <div class="kicker">MAIN OFFICE · 2ND FLOOR</div>
    <div class="title">Main Office · 2nd Floor Seating</div>
    <div id="stats">Loading seats…</div>
    
  </div>
  <div class="tools">
    <div class="modes" id="modes" aria-label="View selection">
      <button data-mode="plan">TOP VIEW</button><button data-mode="orbit">3D VIEW</button><button data-mode="walk">WALK</button>
    </div>
    <button class="btn" id="labels-btn">DESK LABELS ON</button>
    <button class="btn primary" id="save-btn">SAVE IMAGE</button>
    <button class="btn" id="panel-btn">HIDE LIST</button>
  </div>
</div>

<div id="panel">
  <div style="padding:12px;border-bottom:1px solid rgba(127,196,255,.18)"><input id="q" type="search" placeholder="Find a person… name or ID" aria-label="Find a person or seat"></div>
  <button id="directory-login" class="btn" type="button" hidden style="margin:5px 12px">ACCESS EMPLOYEE LIST</button><div id="person-results" hidden style="max-height:38%;overflow:auto;padding:0 12px"></div>
  <div id="list"></div>
  <div class="legend"><span><i style="background:#7fc4ff"></i>Assigned</span><span><i style="border:1px dashed #ffb547"></i>Open seat</span></div>
</div>

<div id="mini-wrap">
  <div style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:#7fc4ff"><span>MINI MAP</span><span>N ↑</span></div>
  <canvas id="mini" width="180" height="245" aria-label="Mini map — click to move the view"></canvas>
  <div id="mini-hint" style="font-size:10px;color:#7fa6cc">Click to recenter the view</div>
</div>

<div id="sel" hidden>
  <div style="display:flex;flex-direction:column;gap:3px"><div id="sel-meta"></div><div id="sel-name"></div></div>
  <button id="sel-edit" style="padding:9px 13px;color:#06182c;background:#ffb547;border:0;border-radius:3px;font-weight:700;cursor:pointer;white-space:nowrap">ASSIGN / MOVE</button>
  <button id="sel-close" aria-label="Clear selection" style="font-size:14px;width:32px;height:32px;border:1px solid rgba(127,196,255,.35);border-radius:3px;background:transparent;color:#d8ecff;cursor:pointer">×</button>
</div>
<div id="hint"></div>
<div id="walk-pad" aria-label="Walk controls"><button data-key="ArrowUp" aria-label="Move forward">↑</button><button data-key="ArrowLeft" aria-label="Turn left">↶</button><button data-key="ArrowDown" aria-label="Move backward">↓</button><button data-key="ArrowRight" aria-label="Turn right">↷</button></div>

<dialog id="assignment-dialog" aria-labelledby="assignment-title">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="assignment-title">Assign employee</h2><button type="button" id="assignment-close" class="btn" aria-label="Close assignment dialog">×</button></div>
  <div id="assignment-current"></div>
  <label for="employee-search">Search employees by name or ID</label><input id="employee-search" type="search" placeholder="Name or employee ID" autocomplete="off">
  <div id="assignment-employees"></div>
  <p id="assignment-note" role="status"></p>
  <div class="assignment-actions"><button type="button" class="btn" id="directory-retry" hidden>ACCESS / RETRY EMPLOYEE LIST</button><button type="button" class="btn" id="assignment-clear">CLEAR SEAT</button></div>
</dialog>
<script type="module">
import {normalizeAssignments} from './main-office/assignments.mjs';
import {createDirectory} from './main-office/directory.mjs';
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------------------------------------------------------------------------
// Layout traced from the hand-drawn 2nd-floor sketch. Sketch pixel coords
// (1200×1600 photo) are converted to metres: 1 px ≈ 2 cm. North = top of sketch.
// ---------------------------------------------------------------------------
const S = 0.02, X = px => +((px - 620) * S).toFixed(2), Z = py => +((py - 870) * S).toFixed(2);
const B = { x1: X(180), x2: X(1060), z1: Z(140), z2: Z(1600) }; // -8.8..8.8, -14.6..14.6
const CX = (B.x1 + B.x2) / 2, CZ = (B.z1 + B.z2) / 2;
const PLAN_KEY = 'main-f2';

// Tables: cx/cz centre, len along the seat rows, dep across. vertical = rows run north–south.
const tbl = (id, x1, y1, x2, y2, n, opts = {}) => {
  const vertical = !!opts.vertical, w = (x2 - x1) * S, d = (y2 - y1) * S;
  return { id, cx: X((x1 + x2) / 2), cz: Z((y1 + y2) / 2), len: vertical ? d : w, dep: vertical ? w : d, n, vertical, collab: !!opts.collab };
};
const TABLES = [
  tbl('T1', 665, 670, 810, 860, 2, { vertical: true, collab: true }),
  tbl('T2', 500, 925, 930, 1000, 3),
  tbl('T3', 515, 1125, 910, 1195, 3),
  tbl('T4', 530, 1270, 870, 1335, 3),
  tbl('T5', 500, 1430, 655, 1490, 2)
];
const room = (n, x1, y1, x2, y2, extra = {}) => ({ n, x1: X(x1), z1: Z(y1), x2: X(x2), z2: Z(y2), lx: X((x1 + x2) / 2), lz: Z((y1 + y2) / 2), ...extra });
const ROOMS = [
  room('STAIRS', 180, 150, 335, 295),
  // lounge fills the back (north) strip from the stairs to the east wall
  room('LOUNGE', 345, 145, 1060, 405, { open: true, ly: 1.2 }),
  room('MAIN DOOR', 370, 570, 570, 640),
  room('AMITH CABIN', 650, 420, 1060, 605),
  room('CONFERENCE ROOM', 180, 590, 350, 840),
  room('DINESH ROOM', 180, 840, 350, 1000),
  room('VISHU CABIN', 180, 1000, 350, 1385),
  room('WASH ROOM', 180, 1450, 460, 1600),
  room('SCRUM ROOM', 740, 1400, 920, 1540)
];
const EXITS = [{ n: 'EXIT 1', z: Z(665) }, { n: 'EXIT 2', z: Z(1215) }, { n: 'EXIT 3', z: Z(1540) }];
// Walls: [px1, py1, px2, py2, glass?] in sketch pixels.
const W = [
  [180, 140, 1060, 140], [180, 140, 180, 1600], [180, 1600, 1060, 1600],
  [1060, 140, 1060, 625], [1060, 705, 1060, 1175], [1060, 1255, 1060, 1500], [1060, 1580, 1060, 1600],
  // stairs enclosure (opening on its east side)
  [180, 295, 335, 295], [335, 140, 335, 225],
  // passage from the lounge down to the (wider) main door
  [370, 405, 370, 570], [570, 405, 570, 570],
  // main door frame
  [370, 570, 370, 640], [570, 570, 570, 640], [370, 640, 570, 640, 1],
  // conference / Dinesh / Vishu cabins along the west wall (doors on the corridor side)
  [180, 590, 350, 590], [180, 840, 350, 840], [180, 1000, 350, 1000], [180, 1385, 350, 1385],
  [350, 590, 350, 690, 1], [350, 740, 350, 840, 1], [350, 840, 350, 890], [350, 940, 350, 1150], [350, 1200, 350, 1385],
  // glass partition between the corridor and the work area, then the wash room
  [460, 715, 460, 1450, 1], [460, 1450, 460, 1600], [180, 1450, 300, 1450], [360, 1450, 460, 1450],
  // Amith cabin, full width to the east wall (door on the south side)
  [650, 420, 1060, 420], [650, 420, 650, 605], [650, 605, 700, 605], [780, 605, 1060, 605],
  // scrum room (glass, door on the west side)
  [740, 1400, 920, 1400, 1], [740, 1400, 740, 1440, 1], [740, 1490, 740, 1540, 1], [920, 1400, 920, 1540, 1], [740, 1540, 920, 1540, 1]
].map(([a, b, c, d, g]) => [X(a), Z(b), X(c), Z(d), g]);

// Seats: two rows per table; vertical table rows are left/right. Plus the office-cabin seat.
function buildSeats() {
  const out = [];
  TABLES.forEach(t => {
    const sides = t.vertical ? [['left', -1], ['right', 1]] : [['top', -1], ['bottom', 1]];
    sides.forEach(([side, away]) => {
      for (let i = 0; i < t.n; i++) {
        const along = -t.len / 2 + t.len * (i + 0.5) / t.n, off = away * (t.dep / 2 + 0.42);
        const x = t.vertical ? t.cx + off : t.cx + along, z = t.vertical ? t.cz + along : t.cz + off;
        out.push({ key: `${t.id}-${side}-${i}`, table: t.id, side, idx: i, away, x, z, name: '' });
      }
    });
  });
  // executive chair sits north of the cabin desk, facing south
  out.push({ key: 'CB-desk-0', table: 'CB', side: 'desk', idx: 0, away: -1, x: X(855), z: Z(470), tx: X(855), tz: Z(522), name: '', cabin: true });
  return out;
}
const seats = buildSeats();
const seatName = s => s.cabin ? 'Amith cabin seat' : `${s.table} · ${s.side[0].toUpperCase() + s.side.slice(1)} ${s.idx + 1}`;

// --------------------------- shared names (API with local fallback) ---------------------------
// Floor-specific assignments preserve employee IDs, names and legacy manual entries.
const LS = 'main-office-floor2-names-v1';
let source = 'local', directory;
const readLocal = () => {
  try { return normalizeAssignments(JSON.parse(localStorage.getItem(LS) || '{}'),seats.map(s => s.key)); }
  catch { return {}; }
};
function applyAssignments(names) {
  seats.forEach(s => {const e=names[s.key];s.name=e?.name || '';s.employeeId=e?.id || '';s.employeeCode=e?.employeeCode || '';});
  refreshVisuals();
}
function saveAssignments(names) {
  try {localStorage.setItem(LS,JSON.stringify(names));}
  catch {alert('Could not save assignments on this device. No seats were changed.');return false;}
  applyAssignments(names);return true;
}
async function refreshSeats() { applyAssignments(readLocal()); }
function editSeat(key) { if(key){focusSeat(key,true);directory?.open(key);} }
window.addEventListener('storage',e=>{if(e.key===LS)refreshSeats();});

// --------------------------- scene ---------------------------
const $ = id => document.getElementById(id), host = $('host');
const state = { mode: 'plan', selKey: null, hoverKey: null, labels: true, q: '' };
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); }
catch (e) { $('loading').textContent = 'WEBGL IS UNAVAILABLE — ENABLE HARDWARE ACCELERATION AND RELOAD'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab';
host.appendChild(renderer.domElement);
const lr = new CSS2DRenderer();
lr.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden';
host.appendChild(lr.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a1d33');
scene.fog = new THREE.Fog('#0a1d33', 55, 130);
const cam = new THREE.PerspectiveCamera(50, 1, 0.05, 300); cam.rotation.order = 'YXZ'; cam.position.set(18, 24, 30);
const controls = new OrbitControls(cam, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: true, zoomSpeed: 0.8, panSpeed: 0.8, rotateSpeed: 0.65, maxPolarAngle: Math.PI * 0.47, minDistance: 6, maxDistance: 110 });
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

scene.add(new THREE.HemisphereLight('#e6f1ff', '#3a4656', 0.9));
const sun = new THREE.DirectionalLight('#fff3e2', 2.4);
sun.position.set(10, 26, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -19, right: 19, top: 19, bottom: -19, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; scene.add(sun);
const fill = new THREE.DirectionalLight('#9cc8ff', 0.5); fill.position.set(-12, 10, -8); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshBasicMaterial({ color: '#0a1d33' }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.25; scene.add(ground);
const grid = new THREE.GridHelper(140, 140, '#1f4a75', '#15375c'); grid.position.y = -0.24; scene.add(grid);

function tex(base, grout, nx, ny, jitter, planks) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  const w = 512 / nx, h = 512 / ny;

});
dom.addEventListener('pointerleave', () => { toolTip.style.display = 'none'; down = null; dom.style.cursor = 'grab'; state.hoverKey = null; styleLabels(); });
dom.addEventListener('pointerup', e => { if (down && down.moved < 7) { const s = seatAt(e); if (s) focusSeat(s.key, true); } down = null; dom.style.cursor = 'grab'; });
dom.addEventListener('dblclick', e => { e.preventDefault(); const s = seatAt(e); if (s) editSeat(s.key); });
window.addEventListener('keydown', e => { if (e.target?.tagName === 'INPUT') return; if (walking && /^(Key[WASD]|Arrow)/.test(e.code)) e.preventDefault(); keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#walk-pad [data-key]').forEach(b => {
  b.onpointerdown = e => { e.preventDefault(); keys[b.dataset.key] = true; b.setPointerCapture(e.pointerId); };
  b.onpointerup = b.onpointercancel = () => { keys[b.dataset.key] = false; };
});

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const fwd = () => V(-Math.sin(yaw), 0, -Math.cos(yaw));
const planDist = () => { const a = cam.aspect || 1; const vh = Math.max(FD + 2, (FW + 2) / a); return vh / (2 * Math.tan(25 * Math.PI / 180)); };
function flyTo(p, t, onEnd, dur) {
  const from = cam.position.clone(), dir = new THREE.Vector3(); cam.getWorldDirection(dir);
  const ft = walking ? from.clone().add(dir) : controls.target.clone();
  walking = false; controls.enabled = false;
  anim = { p0: from, p1: p, t0: ft, t1: t, start: performance.now(), dur: dur ?? 900, onEnd };
}
function setMode(m, instant) {
  state.mode = m; state.hoverKey = null; const c = controls, d = instant ? 1 : undefined;
  if (m === 'plan') flyTo(V(CX, planDist(), CZ + 0.01), V(CX, 0, CZ), () => { c.target.set(CX, 0, CZ); c.enableRotate = false; c.mouseButtons.LEFT = THREE.MOUSE.PAN; c.enabled = true; c.update(); }, d);
  if (m === 'orbit') flyTo(V(CX + 18, 24, CZ + 30), V(CX, 0, CZ), () => { c.target.set(CX, 0, CZ); c.enableRotate = true; c.mouseButtons.LEFT = THREE.MOUSE.ROTATE; c.enabled = true; c.update(); }, d);
  if (m === 'walk') { yaw = Math.PI; pitch = -0.08; const p = V(X(470), 1.6, Z(560)); flyTo(p, p.clone().add(fwd()).add(V(0, -0.08, 0)), () => { walking = true; }, d); }
  renderUI(); styleLabels();
}
function focusSeat(key, fromClick) {
  const same = state.selKey === key; state.selKey = key; styleLabels(); renderUI();
  if (fromClick && state.mode === 'walk') return;
  const s = seats.find(x => x.key === key), c = controls;
  if (state.mode === 'orbit' && !same && !fromClick) {
    const t = V(s.x, 0.6, s.z); flyTo(V(s.x + 2.2, 3.6, s.z + 3.6), t, () => { c.target.copy(t); c.enabled = true; c.update(); });
  } else if (state.mode === 'walk') {
    const t = TABLES.find(t => t.id === s.table), vert = t?.vertical;
    const ox = vert ? s.away * 1.3 : 0, oz = vert ? 0 : s.away * 1.3;
    yaw = Math.atan2(ox, oz); pitch = -0.3;
    const p = V(s.x + ox, 1.6, s.z + oz); flyTo(p, p.clone().add(fwd()).add(V(0, -0.3, 0)), () => { walking = true; });
  }
}
function styleLabels() {
  Object.values(seatLabels).forEach(({ el, lo, s }) => {
    const sel = s.key === state.selKey;
    el.textContent = s.name || 'Empty';
    el.title = seatName(s) + ' · ' + (s.name || 'Empty') + ' · Double-click to edit';
    el.style.background = sel ? '#d7eaff' : '#fff'; el.style.color = sel ? '#082849' : '#254260';
    el.style.border = sel ? '2px solid #3179c9' : '1px solid #bed4e5'; el.style.zIndex = sel ? '5' : '1';
    lo.visible = state.labels && (state.mode === 'plan' || sel || s.key === state.hoverKey) && (!!s.name || sel);
  });
  deskLabels.forEach(lo => { lo.visible = state.labels && state.mode !== 'walk'; });
  roomLabels.forEach(lo => { lo.visible = state.mode !== 'walk'; });
  Object.entries(chairMats).forEach(([k, m]) => { m.emissive.set(k === state.selKey ? '#2f8cff' : '#000000'); m.emissiveIntensity = 0.8; });
}
function refreshVisuals() {
  seats.forEach(s => { chairMats[s.key]?.color.set(s.name ? fabricOn : fabricOff); if (screens[s.key]) screens[s.key].material = s.name ? scrOn : scrOff; });
  styleLabels(); renderUI();
}

// --------------------------- HUD ---------------------------
function renderUI() {
  const used = seats.filter(s => s.name).length;
  $('stats').textContent = `${used} of ${seats.length} seats assigned · ${seats.length - used} open` + ' · saved on this device';
  document.querySelectorAll('#modes [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  $('walk-pad').style.display = state.mode === 'walk' ? 'grid' : 'none';
  $('hint').textContent = state.mode === 'walk' ? 'W A S D / arrows to move · Drag to look around · Mini map to jump'
    : state.mode === 'plan' ? 'Click a seat to select · Double-click to edit · Drag to pan · Scroll to zoom'
    : 'Click a seat to select · Double-click to edit · Drag to orbit · Right-drag to pan';
  $('mini-hint').textContent = state.mode === 'walk' ? 'Click to jump to a spot' : 'Click to recenter the view';
  const sel = seats.find(s => s.key === state.selKey);
  $('sel').hidden = !sel;
  if (sel) { $('sel-meta').textContent = seatName(sel).toUpperCase(); $('sel-name').textContent = sel.name ? sel.name + (sel.employeeCode ? ' · '+sel.employeeCode : '') : 'Open seat'; $('sel-name').style.color = sel.name ? '#fff' : '#ffb547'; }
  const q = state.q.trim().toLowerCase(), list = $('list'); list.replaceChildren();
  const groups = [...TABLES.map(t => ({ id: t.id, title: t.collab ? 'TABLE 1 · COLLAB' : 'TABLE ' + t.id.slice(1), sides: t.vertical ? [['left', 'LEFT SIDE'], ['right', 'RIGHT SIDE']] : [['top', 'TOP SIDE'], ['bottom', 'BOTTOM SIDE']] })), { id: 'CB', title: 'AMITH CABIN', sides: [['desk', 'DESK']] }];
  groups.forEach(g => {
    const all = seats.filter(s => s.table === g.id);
    const blocks = g.sides.map(([side, label]) => [label, all.filter(s => s.side === side && (!q || (s.name || '').toLowerCase().includes(q) || (s.employeeCode || '').toLowerCase().includes(q) || (s.employeeId || '').toLowerCase().includes(q) || seatName(s).toLowerCase().includes(q)))]).filter(([, a]) => a.length);
    if (!blocks.length) return;
    const wrap = document.createElement('div'); wrap.className = 'tbl';
    const h = document.createElement('div'); h.className = 'tbl-h';
    const b = document.createElement('b'); b.textContent = g.title; const sp = document.createElement('span'); sp.textContent = `${all.filter(s => s.name).length}/${all.length} assigned`;
    h.append(b, sp); wrap.append(h);
    blocks.forEach(([label, arr]) => {
      const sd = document.createElement('div'); sd.className = 'side'; sd.textContent = label; wrap.append(sd);
      const gr = document.createElement('div'); gr.className = 'grid';
      arr.forEach(s => {
        const sel = s.key === state.selKey, btn = document.createElement('button'); btn.className = 'seat'; btn.setAttribute('aria-pressed',String(sel));
        btn.textContent = (s.cabin ? 'C1' : 'S' + (s.idx + 1)) + ' · ' + (s.name || 'Empty'); btn.title = 'Select seat; double-click to edit';
        btn.style.background = sel ? '#7fc4ff' : s.name ? 'rgba(127,196,255,.12)' : 'rgba(255,181,71,.05)';
        btn.style.color = sel ? '#06182c' : s.name ? '#e4f0ff' : '#ffb547';
        btn.style.border = sel ? '1px solid #7fc4ff' : s.name ? '1px solid rgba(127,196,255,.35)' : '1px dashed rgba(255,181,71,.5)';
        btn.onclick = () => focusSeat(s.key, false); btn.ondblclick = () => editSeat(s.key);
        gr.append(btn);
      });
      wrap.append(gr);
    });
    list.append(wrap);
  });
  directory?.render();
}
document.querySelectorAll('#modes [data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('labels-btn').onclick = () => { state.labels = !state.labels; $('labels-btn').textContent = state.labels ? 'DESK LABELS ON' : 'DESK LABELS OFF'; styleLabels(); };
$('panel-btn').onclick = () => { const p = $('panel'); p.hidden = !p.hidden; $('panel-btn').textContent = p.hidden ? 'SHOW LIST' : 'HIDE LIST'; };
$('q').oninput = e => { state.q = e.target.value; renderUI(); };
$('sel-edit').onclick = () => editSeat(state.selKey);
$('sel-close').onclick = () => { state.selKey = null; styleLabels(); renderUI(); };

// save image with room/table labels baked in
$('save-btn').onclick = () => {
  renderer.render(scene, cam);
  const src = renderer.domElement, Wd = src.width, H = src.height, k = Wd / src.clientWidth;
  const out = document.createElement('canvas'); out.width = Wd; out.height = H;
  const g = out.getContext('2d'); g.drawImage(src, 0, 0);
  const pill = (txt, x, y, fg, bg, bd, size) => {
    g.font = `700 ${size * k}px "IBM Plex Mono", monospace`;
    const w = g.measureText(txt).width + 14 * k, h = (size + 9) * k;
    g.fillStyle = bg; g.fillRect(x - w / 2, y - h / 2, w, h);
    if (bd) { g.strokeStyle = bd; g.lineWidth = k; g.strokeRect(x - w / 2, y - h / 2, w, h); }
    g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, x, y + 0.5 * k);
  };
  const proj = (x, y, z) => { const v = V(x, y, z).project(cam); return v.z < 1 ? [(v.x + 1) / 2 * Wd, (1 - v.y) / 2 * H] : null; };
  ROOMS.forEach(r => { const p = proj(r.lx, 0.05, r.lz); if (p) pill(r.n, p[0], p[1], '#06182c', '#7fc4ff', null, 11); });
  EXITS.forEach(e => { const p = proj(B.x2 - 0.9, 0.05, e.z); if (p) pill(e.n, p[0], p[1], '#06182c', '#7ef3bc', null, 11); });
  if (state.labels) TABLES.forEach(t => { const p = proj(t.cx, 1.4, t.cz); if (p) pill('TABLE ' + t.id.slice(1), p[0], p[1], '#fff', 'rgba(8,22,40,0.88)', '#7fc4ff', 12); });
  if (state.mode === 'plan') seats.forEach(s => { if (!s.name) return; const p = proj(s.x, 0.8, s.z); if (p) pill(s.name, p[0], p[1], '#254260', '#fff', '#bed4e5', 10); });
  const a = document.createElement('a'); a.download = `main-office-floor2-${state.mode}.png`; a.href = out.toDataURL('image/png'); a.click();
};

// mini map
const mini = $('mini'); let miniS = 1;
const MP = (x, z) => [(x - B.x1 + 0.4) * miniS, (z - B.z1 + 0.4) * miniS];
function drawMini() {
  const Wm = 180, Hm = 245, dpr = Math.min(devicePixelRatio || 1, 2);
  if (mini.width !== Wm * dpr) { mini.width = Wm * dpr; mini.height = Hm * dpr; }
  const g = mini.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  miniS = Math.min(Wm / (FW + 0.8), Hm / (FD + 0.8));
  g.fillStyle = '#0a1d33'; g.fillRect(0, 0, Wm, Hm);
  ROOMS.forEach(r => {
    const [a, b] = MP(r.x1, r.z1), [c, d] = MP(r.x2, r.z2);
    g.fillStyle = r.open ? 'rgba(255,181,71,0.1)' : 'rgba(127,196,255,0.1)'; g.fillRect(a, b, c - a, d - b);
    g.fillStyle = '#7fc4ff'; g.font = '600 6px "IBM Plex Mono", monospace'; g.textAlign = 'center'; g.fillText(r.n.split(' ')[0], (a + c) / 2, (b + d) / 2 + 2);
  });
  W.forEach(([x1, z1, x2, z2, gl]) => { const [a, b] = MP(x1, z1), [c, d] = MP(x2, z2); g.strokeStyle = gl ? 'rgba(127,196,255,0.6)' : '#bfe3ff'; g.lineWidth = gl ? 1 : 2; g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); });
  EXITS.forEach(e => { const [a, b] = MP(B.x2, e.z); g.fillStyle = '#7ef3bc'; g.fillRect(a - 2, b - 8, 4, 16); });
  TABLES.forEach(t => {
    const w = (t.vertical ? t.dep : t.len) * miniS, h = (t.vertical ? t.len : t.dep) * miniS;
    const [a, b] = MP(t.cx, t.cz);
    g.fillStyle = 'rgba(127,196,255,0.25)'; g.strokeStyle = '#7fc4ff'; g.lineWidth = 1; g.fillRect(a - w / 2, b - h / 2, w, h); g.strokeRect(a - w / 2, b - h / 2, w, h);
    g.fillStyle = '#fff'; g.font = '600 7px "IBM Plex Mono", monospace'; g.textAlign = 'center'; g.fillText(t.id, a, b + 2.5);
  });
  seats.forEach(s => {
    const [a, b] = MP(s.x, s.z), sel = s.key === state.selKey;
    g.beginPath(); g.arc(a, b, sel ? 3.6 : 2.2, 0, Math.PI * 2);
    if (sel) { g.fillStyle = '#fff'; g.fill(); } else if (s.name) { g.fillStyle = '#7fc4ff'; g.fill(); } else { g.strokeStyle = '#ffb547'; g.lineWidth = 1; g.stroke(); }
  });
  const dir = new THREE.Vector3(); cam.getWorldDirection(dir);
  const p = state.mode !== 'walk' && !walking ? controls.target : cam.position;
  const [a, b] = MP(p.x, p.z), ang = Math.atan2(dir.z, dir.x);
  if (Math.hypot(dir.x, dir.z) > 0.2) { g.fillStyle = 'rgba(255,181,71,0.28)'; g.beginPath(); g.moveTo(a, b); g.arc(a, b, 28, ang - 0.45, ang + 0.45); g.closePath(); g.fill(); }
  g.fillStyle = '#ffb547'; g.beginPath(); g.arc(a, b, 4, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#0a1d33'; g.lineWidth = 1.5; g.stroke();
}
mini.onclick = e => {
  const r = mini.getBoundingClientRect();
  const x = (e.clientX - r.left) / miniS + B.x1 - 0.4, z = (e.clientY - r.top) / miniS + B.z1 - 0.4;
  if (x < B.x1 || x > B.x2 || z < B.z1 || z > B.z2) return;
  if (state.mode === 'walk') { const p = V(x, 1.6, z); flyTo(p, p.clone().add(fwd()).add(V(0, pitch, 0)), () => { walking = true; }, 500); }
  else { const off = cam.position.clone().sub(controls.target), t = V(x, 0, z); flyTo(t.clone().add(off), t, () => { controls.target.copy(t); controls.enabled = true; controls.update(); }, 600); }
};

function resize() {
  const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); lr.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host); resize();

function loop(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  walls.forEach(w => { const target = state.mode === 'walk' ? w.userData.full : 1.1; w.scale.y += (target - w.scale.y) * Math.min(1, dt * 5); });
  if (anim) {
    const a = anim, k = Math.min(1, (now - a.start) / a.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    cam.position.lerpVectors(a.p0, a.p1, e); cam.lookAt(new THREE.Vector3().lerpVectors(a.t0, a.t1, e));
    if (k >= 1) { anim = null; a.onEnd && a.onEnd(); }
  } else if (walking) {
    const f = fwd(), r = V(Math.cos(yaw), 0, -Math.sin(yaw)), mv = new THREE.Vector3();
    if (keys.KeyW || keys.ArrowUp) mv.add(f); if (keys.KeyS || keys.ArrowDown) mv.sub(f);
    if (keys.KeyD) mv.add(r); if (keys.KeyA) mv.sub(r);
    if (keys.ArrowLeft) yaw += dt * 1.8; if (keys.ArrowRight) yaw -= dt * 1.8;
    if (mv.lengthSq()) cam.position.addScaledVector(mv.normalize(), dt * 3);
    cam.position.x = Math.max(B.x1 + 0.3, Math.min(B.x2 - 0.3, cam.position.x));
    cam.position.z = Math.max(B.z1 + 0.3, Math.min(B.z2 - 0.3, cam.position.z));
    cam.position.y = 1.6; cam.rotation.set(pitch, yaw, 0);
  } else if (controls.enabled) controls.update();
  Object.values(seatLabels).forEach(({ el, s }) => { el.style.opacity = state.mode === 'plan' || s.key === state.selKey || s.key === state.hoverKey ? '1' : '0'; });
  renderer.render(scene, cam); lr.render(scene, cam); drawMini();
}

$('loading').remove();
const startMode = new URL(location.href).searchParams.get('view');
setMode(['plan', 'orbit', 'walk'].includes(startMode) ? startMode : 'plan', true);
refreshVisuals();
refreshSeats();
setInterval(refreshSeats, 5000);
directory = createDirectory({seats,seatName,selectedSeat:()=>state.selKey,read:readLocal,save:saveAssignments,focusSeat});
renderer.setAnimationLoop(loop);
</script>
</body>
